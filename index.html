<script>
//tambah Yoon
adaYaYuYo = [false,false,false]
cekerYoon = []
function tambahYoon(soal){

   if (soal[1]=='ya'){adaYaYuYo[0]=true}
   if (soal[1]=='yu'){adaYaYuYo[1]=true}
   if (soal[1]=='yo'){adaYaYuYo[2]=true}
   if (!adaYaYuYo.includes(true)){return}
   if ((soal[1][soal[1].length-1] != 'i')||(soal[1]=='i')){return}
 
   var hasil = [];
   hasil.push(soal[0])
   if (soal[0] == 'き'){hasil.push('ky')}
   if (soal[0] == 'し'){hasil.push('sh')}
   if (soal[0] == 'ち'){hasil.push('ch')}
   if (soal[0] == 'に'){hasil.push('ny')}
   if (soal[0] == 'ひ'){hasil.push('hy')}
   if (soal[0] == 'み'){hasil.push('my')}
   if (soal[0] == 'り'){hasil.push('ry')}
   if (soal[0] == 'ぎ'){hasil.push('gy')}
   if (soal[0] == 'じ'){hasil.push('j')}
   if (soal[0] == 'び'){hasil.push('by')}
   if (soal[0] == 'ぴ'){hasil.push('py')}
   if (hasil.length < 2){return}
   
   let yauoInd = Math.floor(Math.random()*3);
   while (adaYaYuYo[yauoInd] == false){yauoInd = (yauoInd+1)%3;}
   
   if (yauoInd==0){hasil[0] += 'ゃ'; hasil[1] += 'a'}
   if (yauoInd==1){hasil[0] += 'ゅ'; hasil[1] += 'u'}
   if (yauoInd==2){hasil[0] += 'ょ'; hasil[1] += 'o'}
  

   if (soal.length < 3){
     if (cekerYoon.includes(hasil[1])){return};
     cekerYoon.push(hasil[1]);
     hiragana.push(hasil);
   }
   else{
     if (cekerYoon.includes(hasil[1]+'2')){return};
     cekerYoon.push(hasil[1]+'2');
     hiragana2.push(hasil);
   }

   
}
</script>

<script>
  //Fungsi-fungsi
//fungsi warna random------------------------------------------------------------------------------
  function getRandomColor() {
    var lettersz = '0123456789abcdef';
    var colorz = '#';
    for (var i = 0; i < 6; i++) {
      colorz += lettersz[Math.floor(Math.random() * 16)];
    }
    return colorz;
  }
//------------------------------------------------------------------------------------------------
//fungsi string random---------------------------------------------------------------------------------------------------------------------
  function randstring(length) {
    var result           = '';
    var characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var charactersLength = characters.length;
    for ( var i = 0; i < length; i++ ) {
      result += characters.charAt(Math.floor(Math.random() *charactersLength));
   }
   return result;
  }
//------------------------------------------------------------------------------------------------
</script>
